<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1ec;--ink:#2b2838;--ink2:#5d5568;--mauve:#8f6a8c;--dusk:#6f7fb0}
html,body{margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ink);position:relative;font-family:Outfit,sans-serif}
svg.art{position:absolute;inset:0}
h1{position:absolute;margin:0;font-family:'Instrument Serif',serif;font-weight:400;line-height:.96;letter-spacing:-.01em;color:var(--ink)}
h1 em{font-style:italic;color:var(--dusk)}
.lines{position:absolute;font-family:Outfit,sans-serif;font-weight:700;color:var(--ink);line-height:1.34;letter-spacing:-.005em}
.lines div:before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--mauve);margin-right:.55em;vertical-align:.08em}
.lead{position:absolute;font-family:Outfit,sans-serif;font-weight:700;color:var(--ink);line-height:1.05;letter-spacing:-.015em}
.lead small{display:block;font-weight:600;color:var(--mauve);letter-spacing:0;margin-top:.12em}
.foot{position:absolute;font-family:Outfit,sans-serif;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mauve)}
</style></head><body>
<svg class="art" id="art"></svg>
<h1 id="title">AI for Physics</h1>
<div class="lead" id="lead"></div>
<div class="lines" id="lines"><div>Certified bounds on published results</div><div>Exact checks, independent referees</div><div>Bug reports on physics software</div></div>
<div class="foot" id="foot">de Sitter bootstrap &middot; cosmology Pad&eacute; bounds &middot; KITE &middot; github.com/rpinho</div>
<script>
const CFG={"W": 1200, "H": 627, "blur": 87, "vs": 0.930703125, "linesTop": 0.33, "washes": [[0.12, 0.7, 0.33, "#dbe2f2", 0.85], [0.32, 0.22, 0.3, "#e6dcf0", 0.8], [0.6, 0.58, 0.26, "#d9e6f2", 0.9], [0.85, 0.38, 0.28, "#f7ddcb", 0.8], [0.97, 0.78, 0.24, "#dfe0f2", 0.7]], "spots": [["wave", 0.66, 0.36, 1.15], ["atom", 0.875, 0.5, 0.95], ["feynman", 0.66, 0.74, 0.8]], "thread": [[504, 138], [600, 94], [720, 75], [840, 88], [960, 75], [1056, 100], [1140, 188]], "curlDir": 1, "leafGap": 47, "sparks": [[0.08, 2.6], [0.34, 3.2], [0.62, 2.8], [0.9, 3.2]], "noLeaf": []};
const {W,H}=CFG;
document.documentElement.style.width=document.body.style.width=W+'px';
document.documentElement.style.height=document.body.style.height=H+'px';
{const T=document.getElementById('title'),L=document.getElementById('lines'),F=document.getElementById('foot'),D=document.getElementById('lead');
 const pad=Math.round(W*0.045);
 Object.assign(T.style,{left:pad+'px',top:Math.round(H*0.085)+'px',fontSize:Math.round(H*0.135)+'px'});
 let lt=CFG.linesTop;
 if(D.innerHTML.trim()){Object.assign(D.style,{left:pad+'px',top:Math.round(H*lt)+'px',fontSize:Math.round(H*0.088)+'px'});
   D.querySelector('small')&&(D.querySelector('small').style.fontSize=Math.round(H*0.052)+'px');lt+=0.215}
 Object.assign(L.style,{left:pad+'px',top:Math.round(H*lt)+'px',fontSize:Math.round(H*0.049)+'px'});
 Object.assign(F.style,{left:pad+'px',top:Math.round(H*0.885)+'px',fontSize:Math.round(H*0.027)+'px'});}
let seed=29;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const G=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const INK='#2b2838';
const f=n=>(+n).toFixed(1);
const P=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L')+'Z';
const PL=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join('L');
function blob(cx,cy,rx,ry,w,ph,n=140){const pts=[];for(let i=0;i<n;i++){const t=i/n*2*Math.PI;const k=1+w[0]*Math.sin(3*t+ph)+w[1]*Math.sin(5*t+ph*1.7)+w[2]*Math.sin(2*t+ph*.6);pts.push([cx+rx*k*Math.cos(t),cy+ry*k*Math.sin(t)])}return pts}
const scale=(pts,c,s)=>pts.map(p=>[c[0]+(p[0]-c[0])*s,c[1]+(p[1]-c[1])*s]);
function inside(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function spark(x,y,r,col='#fff6e0',glow='#f2c27a',o=1){return `<g opacity="${o}"><circle cx="${f(x)}" cy="${f(y)}" r="${f(r*2.6)}" fill="${glow}" opacity=".55" filter="url(#soft)"/><path d="M${f(x)} ${f(y-r*1.9)} Q${f(x+r*.28)} ${f(y-r*.28)} ${f(x+r*1.9)} ${f(y)} Q${f(x+r*.28)} ${f(y+r*.28)} ${f(x)} ${f(y+r*1.9)} Q${f(x-r*.28)} ${f(y+r*.28)} ${f(x-r*1.9)} ${f(y)} Q${f(x-r*.28)} ${f(y-r*.28)} ${f(x)} ${f(y-r*1.9)}Z" fill="${col}"/></g>`}
function twinkle(x,y,r,col=INK,o=.5){return `<path d="M${f(x)} ${f(y-r)} L${f(x+r*.22)} ${f(y-r*.22)} L${f(x+r)} ${f(y)} L${f(x+r*.22)} ${f(y+r*.22)} L${f(x)} ${f(y+r)} L${f(x-r*.22)} ${f(y+r*.22)} L${f(x-r)} ${f(y)} L${f(x-r*.22)} ${f(y-r*.22)}Z" fill="${col}" opacity="${o}"/>`}

// ======================= 1. STORYBOOK (learning games) =======================
function book(){
 let s='';
 const yT=u=>-22-18*Math.sin(Math.PI*u*.75), yB=u=>32-14*Math.sin(Math.PI*u*.75);
 const page=(sg,ox=0,oy=0,sc=1)=>{const pts=[];for(let i=0;i<=24;i++){const u=i/24;pts.push([sg*u*96*sc+ox,yT(u)*sc+oy])}
  for(let i=0;i<=6;i++){const v=i/6;pts.push([sg*(96+2*Math.sin(Math.PI*v))*sc+ox,(yT(1)+(yB(1)-yT(1))*v)*sc+oy])}
  for(let i=24;i>=0;i--){const u=i/24;pts.push([sg*u*96*sc+ox,yB(u)*sc+oy])}return pts};
 // shadow
 s+=`<ellipse cx="0" cy="44" rx="104" ry="9" fill="${INK}" opacity=".07" filter="url(#soft)"/>`;
 // cover
 [-1,1].forEach(sg=>{s+=`<path d="${P(page(sg,sg*3,7,1.04))}" fill="#86a3c3" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>`});
 // page stack edges
 [-1,1].forEach(sg=>{for(let k=3;k>=1;k--){s+=`<path d="${P(page(sg,sg*k*.6,k*1.7,1))}" fill="#fbf4ea" stroke="${INK}" stroke-width=".7" stroke-opacity=".55"/>`}});
 // pages
 [-1,1].forEach(sg=>{s+=`<path d="${P(page(sg))}" fill="url(#pageG${sg<0?'L':'R'})" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>`;
  // gutter hatching
  for(let i=0;i<9;i++){const u=.01+i*.012;const x=sg*u*96;s+=`<line x1="${f(x)}" y1="${f(yT(u)+3)}" x2="${f(x)}" y2="${f(yB(u)-3)}" stroke="${INK}" stroke-width=".55" stroke-opacity="${f(.32-i*.032)}"/>`}});
 // left page: lines of text
 for(let r=0;r<6;r++){let pts=[];const u0=.16,u1=r==5?.55:.86;for(let i=0;i<=16;i++){const u=u0+(u1-u0)*i/16;pts.push([-u*96,yT(u)+15+r*7.6+ (r*1.0)*(u)])}
  s+=`<path d="${PL(pts)}" fill="none" stroke="${INK}" stroke-width=".9" stroke-opacity=".38" stroke-linecap="round"/>`}
 // right page: a little crescent moon + stars doodle
 s+=`<g transform="translate(50 -6)"><path d="M -6 -15 A 15 15 0 1 0 12 7 A 12 12 0 1 1 -6 -15 Z" fill="#f2cf8f" stroke="${INK}" stroke-width="1.1" stroke-linejoin="round"/>${twinkle(20,-14,5,'#e58f73',.95)}${twinkle(-22,8,3.2,'#8db59a',.95)}${twinkle(26,10,2.6,INK,.6)}</g>`;
 // bookmark ribbon
 s+=`<path d="M 2 31 L 2 60 L 7 55 L 12 60 L 12 30" fill="#e58f73" stroke="${INK}" stroke-width="1.1" stroke-linejoin="round"/>`;
 // spine line
 s+=`<line x1="0" y1="-22" x2="0" y2="32" stroke="${INK}" stroke-width="1.2"/>`;
 // floating letter tiles
 const tiles=[['A',-52,-76,-14,'#f6c7b6'],['B',0,-104,8,'#cfe3d2'],['C',52,-72,-6,'#cbdbf0']];
 tiles.forEach(([L,x,y,r,c])=>{s+=`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-15" y="-13" width="30" height="30" rx="6" fill="${INK}" opacity=".12"/><rect x="-15" y="-15" width="30" height="30" rx="6" fill="${c}" stroke="${INK}" stroke-width="1.3"/><rect x="-11.5" y="-11.5" width="23" height="23" rx="4" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1"/><text x="0" y="8" text-anchor="middle" font-family="Instrument Serif, serif" font-size="23" fill="${INK}">${L}</text></g>`});
 // little rising flourishes
 [[-34,-48,-1],[22,-60,1],[60,-42,1]].forEach(([x,y,sg])=>{s+=`<path d="M${x} ${y} q ${sg*4} -6 0 -12 q ${-sg*4} -6 0 -12" fill="none" stroke="${INK}" stroke-width=".8" stroke-opacity=".35" stroke-linecap="round"/>`});
 return s;
}

// ======================= 2. GEOMETRY (mathematics) =======================
function geo(){
 let s='';const r=60,h=r*Math.SQRT2,tl=30*Math.PI/180,ct=Math.cos(tl),st=Math.sin(tl);
 const pr=([X,Y,Z])=>[X,-Y*ct+Z*st];
 const view=[0,st,ct];
 // construction: circumscribing circle + arcs
 s+=`<circle cx="0" cy="0" r="104" fill="none" stroke="${INK}" stroke-width=".7" stroke-opacity=".2"/>`;
 s+=`<circle cx="0" cy="0" r="96" fill="none" stroke="${INK}" stroke-width=".5" stroke-opacity=".14" stroke-dasharray="1 4"/>`;
 s+=`<path d="M -40 -112 A 120 120 0 0 1 40 -112" fill="none" stroke="${INK}" stroke-width=".6" stroke-opacity=".22"/><path d="M 92 -76 A 120 120 0 0 1 112 -30" fill="none" stroke="${INK}" stroke-width=".6" stroke-opacity=".22"/>`;
 const ell=(Y,a0,a1,n=60)=>{const pts=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pts.push(pr([r*Math.cos(a),Y,r*Math.sin(a)]))}return pts};
 s+=`<ellipse cx="0" cy="${f(h/2*ct+r*st+8)}" rx="70" ry="9" fill="${INK}" opacity=".07" filter="url(#soft)"/>`;
 // cylinder body (glass)
 const body=[...ell(h/2,0,Math.PI),...ell(-h/2,Math.PI,0)];
 s+=`<path d="${P(body)}" fill="url(#glass)" />`;
 s+=`<path d="${PL(ell(-h/2,Math.PI,2*Math.PI))}" fill="none" stroke="${INK}" stroke-width=".8" stroke-opacity=".4" stroke-dasharray="2 3"/>`;
 // engraved hatching on shaded right side
 for(let i=0;i<34;i++){const a=Math.PI*(i/34)*.5; // from right edge inward
  const X=r*Math.cos(a),Z=r*Math.sin(a);const p1=pr([X,h/2,Z]),p2=pr([X,-h/2,Z]);const o=.42*Math.pow(Math.cos(a),1.6);
  s+=`<line x1="${f(p1[0])}" y1="${f(p1[1])}" x2="${f(p2[0])}" y2="${f(p2[1])}" stroke="${INK}" stroke-width=".55" stroke-opacity="${f(o)}"/>`}
 // left highlight
 {const a=Math.PI*.83;const X=r*Math.cos(a),Z=r*Math.sin(a);const p1=pr([X,h/2-4,Z]),p2=pr([X,-h/2+6,Z]);s+=`<line x1="${f(p1[0])}" y1="${f(p1[1])}" x2="${f(p2[0])}" y2="${f(p2[1])}" stroke="#fff" stroke-width="3" stroke-opacity=".8" stroke-linecap="round"/>`}
 // top face
 s+=`<path d="${P(ell(h/2,0,2*Math.PI))}" fill="#eef3fa" fill-opacity=".75"/>`;
 // tetrahedron: opposite edges = perpendicular diameters of top & bottom discs (regular, h = r*sqrt2)
 const al=(CFG.al??-58)*Math.PI/180;
 const V=[[r*Math.cos(al),h/2,r*Math.sin(al)],[-r*Math.cos(al),h/2,-r*Math.sin(al)],[r*Math.cos(al+Math.PI/2),-h/2,r*Math.sin(al+Math.PI/2)],[-r*Math.cos(al+Math.PI/2),-h/2,-r*Math.sin(al+Math.PI/2)]];
 const F=[[0,1,2],[0,1,3],[0,2,3],[1,2,3]];
 const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dt=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
 const vis=F.map(([a,b,c])=>{let n=cr(sub(V[b],V[a]),sub(V[c],V[a]));const cen=[(V[a][0]+V[b][0]+V[c][0])/3,(V[a][1]+V[b][1]+V[c][1])/3,(V[a][2]+V[b][2]+V[c][2])/3];if(dt(n,cen)<0)n=n.map(x=>-x);return {lit:dt(n,[-.5,.6,.62]),v:dt(n,view)>0}});
 const E=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
 const Vp=V.map(pr);
 const tints=['#d8e7dc','#cfdcf0','#e6d9ee','#f4dccf'];
 F.forEach((fc,i)=>{if(!vis[i].v)return;const pts=fc.map(k=>Vp[k]);const op=.55+.25*Math.max(0,vis[i].lit);
  s+=`<path d="${P(pts)}" fill="${tints[i]}" fill-opacity="${f(op)}"/>`;
  if(vis[i].lit<.35){ // engraved hatch on the darker face
   s+=`<clipPath id="tf${i}"><path d="${P(pts)}"/></clipPath><g clip-path="url(#tf${i})">`;for(let k=-140;k<140;k+=4.2){s+=`<line x1="${k-60}" y1="-100" x2="${k+60}" y2="100" stroke="${INK}" stroke-width=".5" stroke-opacity=".3"/>`}s+=`</g>`}});
 E.forEach(([a,b])=>{const fs=F.map((fc,i)=>fc.includes(a)&&fc.includes(b)?i:-1).filter(i=>i>=0);if(!fs.some(i=>vis[i].v))s+=`<line x1="${f(Vp[a][0])}" y1="${f(Vp[a][1])}" x2="${f(Vp[b][0])}" y2="${f(Vp[b][1])}" stroke="${INK}" stroke-width=".9" stroke-opacity=".5" stroke-dasharray="3 2.5"/>`});
 E.forEach(([a,b])=>{const fs=F.map((fc,i)=>fc.includes(a)&&fc.includes(b)?i:-1).filter(i=>i>=0);if(fs.some(i=>vis[i].v))s+=`<line x1="${f(Vp[a][0])}" y1="${f(Vp[a][1])}" x2="${f(Vp[b][0])}" y2="${f(Vp[b][1])}" stroke="${INK}" stroke-width="1.5" stroke-linecap="round"/>`});
 // cylinder outline (front)
 s+=`<path d="${P(ell(h/2,0,2*Math.PI))}" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
 s+=`<path d="${PL(ell(-h/2,0,Math.PI))}" fill="none" stroke="${INK}" stroke-width="1.4"/>`;
 [0,Math.PI].forEach(a=>{const p1=pr([r*Math.cos(a),h/2,0]),p2=pr([r*Math.cos(a),-h/2,0]);s+=`<line x1="${f(p1[0])}" y1="${f(p1[1])}" x2="${f(p2[0])}" y2="${f(p2[1])}" stroke="${INK}" stroke-width="1.4"/>`});
 Vp.forEach(p=>s+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2.4" fill="#fffaf2" stroke="${INK}" stroke-width="1"/>`);
 // axis
 s+=`<line x1="0" y1="${f(-h/2*ct-16)}" x2="0" y2="${f(h/2*ct+16)}" stroke="${INK}" stroke-width=".6" stroke-opacity=".35" stroke-dasharray="6 3 1 3"/>`;
 return s;
}

// ======================= 3. CELL + DNA (biology) =======================
function cell(){
 let s='';const C=[0,0];
 const cb=blob(0,0,86,74,[.03,.02,.014],0.8,160);
 s+=`<path d="${P(cb)}" fill="url(#cyto)"/>`;
 for(let i=0;i<cb.length;i++){const t=i/cb.length*2*Math.PI;const sh=Math.cos(t-0.75);if(sh<0.05)continue;const p=cb[i];const d=Math.hypot(p[0],p[1]);const L=(4+13*sh)*(0.6+0.5*R());
  s+=`<line x1="${f(p[0]-p[0]/d*3)}" y1="${f(p[1]-p[1]/d*3)}" x2="${f(p[0]-p[0]/d*(3+L))}" y2="${f(p[1]-p[1]/d*(3+L))}" stroke="${INK}" stroke-opacity="${f(.15+.3*sh)}" stroke-width=".6"/>`}
 s+=`<path d="${P(cb)}" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;
 s+=`<path d="${P(scale(cb,C,.955))}" fill="none" stroke="${INK}" stroke-width=".7" stroke-opacity=".6"/>`;
 const N=[-10,-4];
 // ER arcs
 for(let k=0;k<3;k++){const rr=44+k*7;let d='';for(let a=140;a<=250;a+=4){const t=a*Math.PI/180;const q=rr+2*Math.sin(a*.25+k);d+=(a==140?'M':'L')+f(N[0]+q*Math.cos(t))+' '+f(N[1]+q*Math.sin(t))}s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width=".8" stroke-opacity="${f(.5-k*.1)}" stroke-linecap="round"/>`}
 // mitochondria
 [[48,-38,28],[44,36,-22],[-52,44,58]].forEach(([x,y,rot])=>{s+=`<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="16" ry="7" fill="#f6dccf" stroke="${INK}" stroke-width="1"/>`;let d='M-11 0';for(let i=0;i<6;i++)d+=` L${-9+i*4} ${i%2?3.6:-3.6}`;s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width=".7" stroke-opacity=".7"/></g>`});
 // golgi
 s+=`<g transform="rotate(-20 62 2)">`;for(let k=0;k<4;k++){const y=-6+k*5.5,w=24-Math.abs(k-1.5)*4;s+=`<path d="M${62-w/2} ${y} q3 3 ${w/2-3} 3 q${w/2-3} 0 ${w/2-3} -3" fill="none" stroke="${INK}" stroke-width="1" stroke-opacity=".7" stroke-linecap="round"/>`}s+=`</g>`;
 for(let i=0;i<10;i++){const a=R()*6.283,q=58+R()*16;const x=Math.cos(a)*q,y=Math.sin(a)*q*.86;if(!inside(scale(cb,C,.9),x,y)||Math.hypot(x-N[0],y-N[1])<48)continue;s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(1.6+R()*2)}" fill="none" stroke="${INK}" stroke-width=".7" stroke-opacity=".55"/>`}
 // nucleus
 const nb=blob(N[0],N[1],38,35,[.025,.018,.02],2.1,110);
 s+=`<path d="${P(nb)}" fill="url(#nuc)"/>`;
 for(let i=0;i<900;i++){const x=N[0]+(R()*2-1)*40,y=N[1]+(R()*2-1)*37;if(!inside(nb,x,y))continue;const d=Math.hypot((x-N[0])/38,(y-N[1])/35);if(R()>.1+.85*Math.pow(d,4))continue;s+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(.45+R()*.5)}" fill="#3e3248" opacity=".5"/>`}
 s+=`<circle cx="${N[0]-10}" cy="${N[1]-9}" r="9" fill="#cdb8de"/>`;
 for(let i=0;i<120;i++){const a=R()*6.283,q=Math.sqrt(R())*9;s+=`<circle cx="${f(N[0]-10+Math.cos(a)*q)}" cy="${f(N[1]-9+Math.sin(a)*q)}" r=".6" fill="#3e3248" opacity="${f(.3+.4*(1-q/9))}"/>`}
 s+=`<path d="${P(nb)}" fill="none" stroke="${INK}" stroke-width="1.5"/>`;
 for(let i=0;i<nb.length;i+=10){const p=nb[i];s+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="1.8" fill="#f4eef8" stroke="${INK}" stroke-width=".7"/>`}
 return s;
}
// B-DNA double helix along local x. Backbones offset by PHI (~0.31 turn), so the
// gaps between them alternate MAJOR (wide) and MINOR (narrow) groove. Depth-sorted.
function helix(len,rad,pitch){
 const PHI=2*Math.PI*0.31;let back='',front='',rungs='';
 const pt=(x,j)=>{const th=2*Math.PI*x/pitch+j*PHI;return [x,rad*Math.sin(th),Math.cos(th)]};
 const env=x=>Math.min(1,x/(pitch*.35),(len-x)/(pitch*.35)); // taper ends
 const cols=[['#e58f73','#7f9fc6'],['#8db59a','#b48ab0']];
 const nbp=Math.round(len/pitch*10);
 for(let b=0;b<=nbp;b++){const x=b*len/nbp;const a=pt(x,0),c=pt(x,1);const e=env(x);if(e<.2)continue;const ya=a[1]*e,yc=c[1]*e,ym=(ya+yc)/2;const dep=(a[2]+c[2])/2;const o=.45+.35*(dep+1)/2;const pc=cols[b%2];
  rungs+=`<line x1="${f(x)}" y1="${f(ya)}" x2="${f(x)}" y2="${f(ym)}" stroke="${pc[0]}" stroke-width="2" stroke-opacity="${f(o)}" stroke-linecap="round"/><line x1="${f(x)}" y1="${f(ym)}" x2="${f(x)}" y2="${f(yc)}" stroke="${pc[1]}" stroke-width="2" stroke-opacity="${f(o)}" stroke-linecap="round"/>`}
 const dx=1.5;
 for(let j=0;j<2;j++)for(let x=0;x<len;x+=dx){const a=pt(x,j),b=pt(x+dx,j);const e1=env(x),e2=env(x+dx);const dep=(a[2]+b[2])/2;const w=1.3+2.0*(dep+1)/2;

  if(dep>0)front+=seg;else back+=seg}
 return back+rungs+front;
}
